name: Release RenPy Tools

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r RenPy-Tools-main/requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "RenPy Tools" RenPy-Tools/RenPy_Tools.py

      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/RenPy Tools.exe" -DestinationPath "RenPy-Tools-Windows.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: RenPy-Tools-Windows.zip
